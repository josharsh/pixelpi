name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm vitest run

      - name: Benchmark harness tests
        run: pnpm test:bench

      - name: Real Chrome regressions
        run: pnpm test:browser

      - name: Browser comparison acceptance
        run: pnpm bench:compare --repeats 1 --out /tmp/pixelpi-comparison --require-all-pass

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-comparison
          path: /tmp/pixelpi-comparison
